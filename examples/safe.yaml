apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: config-viewer
  namespace: demo
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: config-viewer-binding
  namespace: demo
subjects:
  - kind: ServiceAccount
    name: demo-reader
    namespace: demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: config-viewer
