name: Validate Kubernetes RBAC Rights Audit
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/audit.py examples/safe.yaml --format json --fail-on high
      - run: python scripts/audit.py examples/unsafe.yaml --format json --fail-on none > findings.json
      - run: python -c 'import json; d=json.load(open("findings.json")); assert {"KR001", "KR003", "KR004", "KR007"} <= {f["rule"] for f in d["findings"]}'
